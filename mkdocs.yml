
site_name: RAS 304 - Rebecca Baker Individual Datasheet
site_description: Driver Nano 2 - Team 102 Robotic Spider Leg
site_url: https://rab2254-art.github.io/rbaker54_RAS304_F26/
repo_url: https://github.com/rab2254-art/rbaker54_RAS304_F26
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: custom_theme/
  palette:
    - scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
  logo: static/logo304.svg
  favicon: static/logo304.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.action.edit

nav:
  - Home: index.md
  - Block Diagram: 01-Block-Diagram/Block-Diagram.md
  - Component Selection: 02-Component-Selection/Component-Selection.md
  - Bill of Materials: 03-BOM/BOM.md
  - Schematic Design: 04-Schematic/schematic.md
  - Power Budget: 05-Power-Budget/Power-Budget.md

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - glightbox

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false

copyright: "Copyright &copy; 2026 Rebecca Baker"
